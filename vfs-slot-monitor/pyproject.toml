[project]
name = "tls-slot-monitor"
version = "0.2.0"
description = "Self-hosted TLScontact visa appointment slot monitor with Telegram notifications"
requires-python = ">=3.11"

dependencies = [
    "undetected-chromedriver>=3.5",
    "selenium>=4.20",
    "python-telegram-bot[job-queue]>=21.8",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "tenacity>=9.0",
    "2captcha-python>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
