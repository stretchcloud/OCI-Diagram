  - country_code: "dnk"
    country_name: "Denmark"
    mission_code: "dnk"
    center_code: ""
    visa_category_code: ""
    centers: ["London"]
    enabled: false

polling:
  slot_check_interval_seconds: 8    # How often to poll the API (5-15 recommended)
  jwt_refresh_hours: 2              # Re-login via browser every N hours
  error_backoff_base: 30            # Base seconds for exponential backoff
  error_backoff_max: 600            # Max backoff (10 minutes)
  notification_cooldown_seconds: 300 # Don't re-notify same slot within 5 min

proxy:
  enabled: false
  urls: []                           # e.g., ["http://user:pass@proxy1:8080", "http://user:pass@proxy2:8080"]
  rotation: "round_robin"            # or "random"

captcha:
  provider: "2captcha"               # or "anticaptcha"
  enabled: false

browser:
  headless: true
  user_data_dir: ""                  # Optional: persist browser profile
