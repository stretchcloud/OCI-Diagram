# VFS Slot Monitor Configuration
#
# Copy this file to config.yaml and edit to your needs.
# Center codes and visa category codes can be discovered using:
#   python -m vfs_monitor --discover

centers:
  - country_code: "fra"
    country_name: "France"
    mission_code: "fra"
    center_code: ""               # Discovered via --discover mode
    visa_category_code: ""        # Discovered via --discover mode
    centers: ["London"]
    enabled: true

  - country_code: "nld"
    country_name: "Netherlands"
    mission_code: "nld"
    center_code: ""
    visa_category_code: ""
    centers: ["London", "Manchester", "Edinburgh"]
    enabled: false

  - country_code: "ita"
    country_name: "Italy"
    mission_code: "ita"
    center_code: ""
    visa_category_code: ""
    centers: ["London"]
    enabled: false

  - country_code: "deu"
