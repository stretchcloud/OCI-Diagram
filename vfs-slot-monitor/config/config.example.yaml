# TLScontact Slot Monitor Configuration
#
# Copy this file to config.yaml and edit to your needs.
# Issuer IDs can be discovered using:
#   python -m vfs_monitor --discover fr
#
# TLScontact URL pattern:
#   https://visas-{country_code}.tlscontact.com/visa/{from_country}/{issuer_id}/home
# Example:
#   https://visas-fr.tlscontact.com/visa/gb/gbLON2fr/home
#   The issuer_id is "gbLON2fr" (from=gb, city=LON, dest=fr)

centers:
  - country_code: "fr"
    country_name: "France"
    from_country: "gb"
    issuer_id: ""               # Discovered via --discover mode, e.g., "gbLON2fr"
    city: "London"
    enabled: true

  - country_code: "fr"
    country_name: "France"
    from_country: "gb"
    issuer_id: ""               # e.g., "gbEDI2fr"
    city: "Edinburgh"
    enabled: false

  - country_code: "fr"
    country_name: "France"
    from_country: "gb"
    issuer_id: ""               # e.g., "gbMAN2fr"
    city: "Manchester"
    enabled: false

  - country_code: "de"
    country_name: "Germany"
    from_country: "gb"
    issuer_id: ""               # e.g., "gbLON2de"
    city: "London"
    enabled: false

  - country_code: "de"
    country_name: "Germany"
    from_country: "gb"
    issuer_id: ""               # e.g., "gbEDI2de"
    city: "Edinburgh"
    enabled: false

  - country_code: "nl"
    country_name: "Netherlands"
    from_country: "gb"
    issuer_id: ""
    city: "London"
    enabled: false

  - country_code: "it"
    country_name: "Italy"
    from_country: "gb"
    issuer_id: ""
    city: "London"
    enabled: false

  - country_code: "es"
    country_name: "Spain"
    from_country: "gb"
    issuer_id: ""
    city: "London"
    enabled: false

  - country_code: "ch"
    country_name: "Switzerland"
    from_country: "gb"
    issuer_id: ""
    city: "London"
    enabled: false

  - country_code: "be"
    country_name: "Belgium"
    from_country: "gb"
    issuer_id: ""
    city: "London"
    enabled: false

polling:
  slot_check_interval_seconds: 300   # How often to check (300s = 5min minimum recommended)
  session_refresh_hours: 4           # Re-login via browser every N hours
  error_backoff_base: 60             # Base seconds for exponential backoff
  error_backoff_max: 1800            # Max backoff (30 minutes)
  notification_cooldown_seconds: 300 # Don't re-notify same slot within 5 min

proxy:
  enabled: false
  urls: []                           # e.g., ["http://user:pass@proxy1:8080"]
  rotation: "round_robin"            # or "random"

captcha:
  provider: "2captcha"               # or "anticaptcha"
  enabled: false

browser:
  headless: true
  user_data_dir: ""                  # Optional: persist browser profile for session reuse
