    mission_code: "deu"
    center_code: ""
    visa_category_code: ""
    centers: ["London"]
    enabled: false

  - country_code: "esp"
    country_name: "Spain"
    mission_code: "esp"
    center_code: ""
    visa_category_code: ""
    centers: ["London"]
    enabled: false

  - country_code: "prt"
    country_name: "Portugal"
    mission_code: "prt"
    center_code: ""
    visa_category_code: ""
    centers: ["London"]
    enabled: false

  - country_code: "grc"
    country_name: "Greece"
    mission_code: "grc"
    center_code: ""
    visa_category_code: ""
    centers: ["London"]
    enabled: false

  - country_code: "che"
